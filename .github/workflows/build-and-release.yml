name: Build and Publish APK

on:
  push:
    branches: [ main, master, zenith-fix ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Remove machine-specific local.properties
        # Depoda Windows yolu iceren bir sdk.dir olabilir; CI'da gecersiz oldugu icin
        # AGP "SDK location not found" hatasi verebilir. SDK'yi ANDROID_HOME'dan alsin.
        run: rm -f local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee gradle-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Collect APK
        run: |
          mkdir -p dist
          APK_PATH=$(find . -type f -name "*debug*.apk" | head -n 1)
          cp "$APK_PATH" dist/kutup-navigasyon-debug.apk

      - name: Publish latest release
        uses: ncipollo/release-action@v1
        with:
          # master/main: apk-latest (eski davranis); diger dallar kendi etiketine yayinlanir, master'in APK'sinin ustune yazmaz
          tag: ${{ (github.ref_name == 'master' || github.ref_name == 'main') && 'apk-latest' || format('apk-{0}', github.ref_name) }}
          name: Kutup Navigasyon APK (${{ github.ref_name }})
          prerelease: ${{ github.ref_name != 'master' && github.ref_name != 'main' }}
          commit: ${{ github.sha }}
          body: |
            Otomatik olusturulan debug APK.
            Run ID: ${{ github.run_id }}
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          artifacts: dist/kutup-navigasyon-debug.apk
